<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuộc phiêu lưu đến Đảo Toán Học</title>
<style>
:root{--ink:#1d3557;--card:#fffdf5;--line:#ffd166;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f1f5ff;--card:#2a3b63}}
:root[data-theme="dark"]{--ink:#f1f5ff;--card:#2a3b63}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:'Trebuchet MS','Comic Sans MS',system-ui,sans-serif;color:var(--ink);background:linear-gradient(#6ec6ff,#c9f0ff 55%,#bff0a8);user-select:none;-webkit-user-select:none}
#app{height:100%;display:grid;grid-template-columns:clamp(110px,20vw,240px) 1fr;grid-template-rows:auto 1fr;gap:0 10px;padding:8px 12px}
#top{grid-column:1/3;display:flex;align-items:center;gap:8px}
#top h1{margin:0;font-size:clamp(14px,2.4vw,24px);flex:1;text-shadow:0 2px #fff8;color:#1d3557}
button{font:inherit;cursor:pointer;border:0;border-radius:18px;padding:10px 16px;min-height:48px;min-width:48px;background:#fff;color:#1d3557;box-shadow:0 5px 0 #0003;font-weight:700;font-size:clamp(15px,2.2vw,22px)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #0003}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:4px solid #ff8c42}
.big{background:#ff8c42;color:#fff;font-size:clamp(20px,3.4vw,34px);padding:14px 32px}
.sc{background:#ffe066}
#side{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;min-height:0}
#bub{background:#fff;color:#1d3557;border-radius:18px;padding:10px 12px;font-size:clamp(13px,1.9vw,20px);font-weight:700;text-align:center;box-shadow:0 4px 0 #0002;position:relative}
#bimo{width:clamp(80px,15vw,180px)}
#bimo.jump{animation:jump .7s 2}
@keyframes jump{50%{transform:translateY(-22px) rotate(-4deg)}}
.arm{transform-origin:100px 96px;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}75%{transform:rotate(-25deg)}}
main{position:relative;min-height:0;min-width:0}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:0}
.scr.on{display:flex}
.card{background:var(--card);color:var(--ink);border-radius:28px;padding:clamp(10px,2vw,22px);box-shadow:0 8px 0 #0002;width:100%;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6vh,16px)}
.card h2{margin:0;font-size:clamp(20px,3.4vw,38px)}
.zt{font-weight:700;font-size:clamp(13px,1.8vw,18px);opacity:.8}
.objs{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:clamp(30px,6.2vw,64px);max-width:100%;counter-reset:c}
.o{position:relative;display:inline-block;line-height:1.1;padding:2px}
.o svg{vertical-align:middle}
.num .o:not(.gone){counter-increment:c}
.num .o:not(.gone)::after{content:counter(c);position:absolute;right:-2px;bottom:-4px;background:#ff8c42;color:#fff;border-radius:50%;width:1.2em;height:1.2em;font:700 .32em/1.2em sans-serif;text-align:center}
.gone{opacity:.28;filter:grayscale(1)}
.row{display:flex;gap:clamp(8px,2vw,22px);align-items:center;justify-content:center;flex-wrap:wrap}
.box{border:4px dashed var(--line);border-radius:20px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:120px}
.box b{font-size:clamp(14px,2vw,22px)}
.plus{font-size:clamp(30px,5vw,56px);font-weight:700}
.plate{width:clamp(90px,16vw,170px);aspect-ratio:1;border-radius:50%;background:radial-gradient(#fff 55%,#e3e8f0 58% 70%,#fff 72%);box-shadow:0 6px 0 #0003}
.seq{display:flex;gap:10px;justify-content:center}
.seq i{font-style:normal;font-weight:800;font-size:clamp(34px,7vw,76px);background:#ffe066;color:#1d3557;border-radius:20px;min-width:1.5em;padding:0 .15em;box-shadow:0 5px 0 #0003}
.seq i.qm{background:#ff8c42;color:#fff}
.nl{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.nl i{font-style:normal;font-weight:800;background:#c9f0ff;color:#1d3557;border-radius:10px;min-width:1.8em;padding:4px;font-size:clamp(14px,2.2vw,24px)}
#ch{display:flex;gap:clamp(8px,2vw,22px);flex-wrap:wrap;justify-content:center}
.ans{font-size:clamp(26px,5vw,54px);min-width:clamp(80px,13vw,150px);background:#fff;border:5px solid #7fb7ff}
.ans.wide{font-size:clamp(20px,3.4vw,38px)}
.ans.ok{background:#7be08a;border-color:#2e9e4a;animation:pop .5s}
.ans.bad{background:#ffd6d6;border-color:#ff9a9a;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#hb{min-height:1.2em;font-weight:700;font-size:clamp(14px,2vw,22px);color:#c25b00}
.nav{display:flex;gap:12px;justify-content:center}
.slots,.pool{display:flex;gap:12px;justify-content:center;min-height:clamp(70px,12vw,120px);align-items:center;flex-wrap:wrap}
.slot{width:clamp(64px,11vw,110px);height:clamp(70px,12vw,120px);border:4px dashed #7fb7ff;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#7fb7ff;font-size:28px;font-weight:700}
.pool{border-radius:20px;background:#e8f6ff;padding:8px 16px;min-width:200px;min-height:clamp(80px,13vw,130px)}
.tile{touch-action:none;cursor:grab;width:clamp(60px,10vw,100px);height:clamp(66px,11vw,110px);border-radius:18px;background:#ffe066;color:#1d3557;font-weight:800;font-size:clamp(34px,6vw,64px);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #0003}
.ghost{position:fixed;transform:translate(-50%,-50%) scale(1.1);pointer-events:none;z-index:50}
.map{position:relative;flex:1;width:100%;min-height:0}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;box-shadow:none;padding:0;color:#1d3557;font-size:clamp(11px,1.7vw,18px);width:clamp(80px,17vw,170px)}
.node .c{width:clamp(58px,11vw,110px);aspect-ratio:1;border-radius:50%;background:#fff;border:6px solid #ffd166;display:flex;align-items:center;justify-content:center;font-size:clamp(30px,6vw,60px);box-shadow:0 6px 0 #0003;position:relative}
.node.lock .c{filter:grayscale(1);opacity:.7}
.node span.t{background:#fffc;border-radius:10px;padding:2px 6px}
.node.next .c{animation:pop 1.6s infinite}
#ov{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
#ov.on{display:flex}
#ov .m{background:var(--card);color:var(--ink);border-radius:28px;padding:24px;max-width:520px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
#ov .m h2{margin:0;font-size:clamp(22px,4vw,36px)}
.big2{font-size:clamp(60px,12vw,120px)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#fx span{position:absolute;bottom:-40px;font-size:34px;animation:fly 1.8s ease-out forwards}
@keyframes fly{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:clamp(15px,2.4vw,26px);font-weight:700}
.stats div{background:#fff;color:#1d3557;border-radius:16px;padding:8px 14px}
#rot{position:fixed;inset:0;background:#1d3557;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;font-size:24px;z-index:99;padding:30px}
.card{position:relative}.card::before{position:absolute;right:14px;top:6px;font-size:clamp(20px,3vw,34px);animation:bobn 4s ease-in-out infinite;pointer-events:none}
#q[data-z="0"] .card::before{content:"🌼🦋🍎"}#q[data-z="1"] .card::before{content:"🌳🦉🍄"}#q[data-z="2"] .card::before{content:"🌉🌈🐰"}#q[data-z="3"] .card::before{content:"🌊🐠🐙"}#q[data-z="4"] .card::before{content:"🏰✨👑"}
#scene{transition:filter 1s}body[data-z="1"] #scene{filter:hue-rotate(-25deg) saturate(1.2)}body[data-z="2"] #scene{filter:hue-rotate(35deg)}body[data-z="3"] #scene{filter:hue-rotate(140deg)}body[data-z="4"] #scene{filter:hue-rotate(200deg) brightness(.95)}
#bimo.sad{animation:sad 1s}@keyframes sad{30%{transform:rotate(-7deg) translateY(5px)}}#bimo.think{animation:think 1.2s ease-in-out 2}@keyframes think{50%{transform:rotate(6deg)}}
.talk #bm{animation:talk .28s infinite;transform-origin:60px 68px}@keyframes talk{50%{transform:scaleY(.4)}}#vol{accent-color:#ff8c42;height:40px}
@media (max-height:480px){#app{grid-template-columns:96px 1fr}.card{padding:6px;gap:4px}.card h2{font-size:18px}.objs{font-size:30px}.ans{min-width:64px;font-size:28px;padding:4px 10px}.zt{display:none}#bub{font-size:11px;padding:4px}button{min-height:44px;padding:4px 10px}.nav{gap:6px}.box{padding:4px 8px}.seq i{font-size:34px}.tile,.slot{height:60px}.pool,.slots{min-height:64px}}
@media (orientation:portrait) and (max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;gap:6px;padding:6px}#top{grid-column:1;gap:4px}#top h1{font-size:12px}#vol{width:50px}#side{flex-direction:row;justify-content:flex-start}#bimo{width:60px}#bub{flex:1;font-size:15px;text-align:left}button{padding:6px 10px;font-size:16px}.nav{flex-wrap:wrap}.ans{min-width:72px;font-size:34px}.objs{font-size:clamp(26px,9vw,46px)}.box{min-width:90px}.node{width:110px;font-size:12px;scale:1}.node .c{width:68px;font-size:34px}.card h2{font-size:21px}.seq i{font-size:40px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.chest .lid{transform:rotateX(105deg)}.chest .gem{opacity:1;transform:translate(-50%,-110px)}.gate .door{display:none}.troph{transform:translate(-50%,-50%)!important}}
#scene{position:fixed;inset:0;z-index:0;pointer-events:none}#scene svg{width:100%;height:100%;display:block}#app{position:relative;z-index:1}
.cl{animation:drift 40s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(26px)}}
button{background:linear-gradient(#fff,#dbe9ff);box-shadow:0 6px 0 #0003,inset 0 3px 0 #fff,0 10px 14px #0002;border:2px solid #fff8}
.big{background:linear-gradient(#ffb066,#ff7a1f)}.sc{background:linear-gradient(#fff0a0,#ffd23f)}
.card{background:linear-gradient(var(--card),var(--zc,#0000));border:4px solid #fff9;box-shadow:0 10px 0 #0002,0 20px 26px #0003}
#q[data-z="0"]{--zc:rgba(120,220,110,.28)}#q[data-z="1"]{--zc:rgba(60,170,110,.3)}#q[data-z="2"]{--zc:rgba(255,190,90,.3)}#q[data-z="3"]{--zc:rgba(70,170,255,.3)}#q[data-z="4"]{--zc:rgba(170,120,255,.3)}
.o{filter:drop-shadow(0 4px 2px #0004)}.o.gone{filter:grayscale(1) drop-shadow(0 4px 2px #0004)}
.seq i{background:linear-gradient(#fff1a0,#ffc83d);box-shadow:0 6px 0 #c58f00,0 12px 12px #0003}.seq i.qm{background:linear-gradient(#ffb066,#ff7a1f);box-shadow:0 6px 0 #b8500c,0 12px 12px #0003}
.tile{background:linear-gradient(#fff1a0,#ffc83d);box-shadow:0 6px 0 #c58f00,0 12px 12px #0003}
#bimo{filter:drop-shadow(0 10px 6px #0005)}
.map{perspective:900px}.node{scale:var(--s,1)}
.node .c{background:radial-gradient(circle at 35% 30%,#fff,#dff3ff 55%,#8fcbff);box-shadow:0 8px 0 #0003,0 18px 16px #0004;animation:bobn 4s ease-in-out infinite;animation-delay:inherit}
@keyframes bobn{50%{transform:translateY(-7px)}}
.node:active{transform:translate(-50%,-50%);box-shadow:none}
.dc{position:absolute;transform:translate(-50%,-50%);font-size:clamp(20px,4vw,44px);filter:drop-shadow(0 5px 3px #0004);pointer-events:none}
#mb{pointer-events:none;position:absolute;transform:translate(-50%,-50%);transition:left 1.4s ease-in-out,top 1.4s ease-in-out;z-index:5;cursor:pointer}
#mb svg{width:clamp(48px,8.5vw,90px);display:block;filter:drop-shadow(0 8px 4px #0005);animation:bobn 3s ease-in-out infinite}
#mb.walk svg{animation:hop .35s infinite}@keyframes hop{50%{transform:translateY(-14px)}}#mb.no{animation:shake .4s}
.fs{position:fixed;font-size:56px;z-index:70;transition:all .9s cubic-bezier(.5,-.3,.7,1);transform:translate(-50%,-50%) scale(1.3);pointer-events:none;filter:drop-shadow(0 4px 4px #0006)}.pulse{display:inline-block;animation:pop .5s}
#fx i{position:absolute;width:10px;height:10px;border-radius:50%;animation:burst 1.2s ease-out forwards}@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.chest{position:relative;width:150px;height:130px;margin:60px auto 0;perspective:500px}
.chest .rays{position:absolute;left:50%;top:30%;width:300px;height:300px;margin:-150px;background:repeating-conic-gradient(#ffe066aa 0 10deg,#0000 10deg 20deg);border-radius:50%;-webkit-mask:radial-gradient(#000 15%,#0000 70%);mask:radial-gradient(#000 15%,#0000 70%);animation:spin 8s linear infinite,fadein 1s .6s both}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fadein{from{opacity:0}}
.chest .body{position:absolute;bottom:0;left:0;width:150px;height:70px;border-radius:8px 8px 16px 16px;background:linear-gradient(90deg,#8d5524,#c68642 50%,#8d5524);border-top:6px solid #ffd166;box-shadow:inset 0 -8px 0 #0003,0 10px 14px #0004}
.chest .body::after{content:'';position:absolute;left:62px;top:-4px;width:26px;height:30px;background:#ffd166;border-radius:6px;box-shadow:inset 0 -5px #e0a800}
.chest .lid{position:absolute;bottom:70px;left:0;width:150px;height:52px;border-radius:75px 75px 6px 6px/52px 52px 6px 6px;background:linear-gradient(90deg,#9c6228,#d99a54 50%,#9c6228);border-bottom:6px solid #ffd166;transform-origin:50% 100%;animation:lid 1.6s ease-out forwards}
@keyframes lid{0%,25%{transform:rotateX(0)}100%{transform:rotateX(105deg)}}
.chest .gem{position:absolute;left:50%;bottom:60px;font-size:36px;opacity:0;transform:translate(-50%,0);animation:gem 1.4s ease-out forwards 1s}
.g2{--gx:-62px;animation-delay:1.2s!important}.g3{--gx:62px;animation-delay:1.4s!important}
@keyframes gem{30%{opacity:1}100%{opacity:1;transform:translate(calc(-50% + var(--gx,0px)),-110px) scale(1.2)}}
.gate{position:relative;width:200px;height:150px;margin:0 auto;perspective:600px;background:radial-gradient(#fff6b0,#ffd166 60%,#0000 75%);border-radius:90px 90px 0 0}
.gate .door{position:absolute;top:0;width:50%;height:100%;background:linear-gradient(#8a6ad8,#5b3fb5);border:4px solid #ffd166;box-sizing:border-box}
.gate .l{left:0;transform-origin:left;border-radius:90px 0 0 0;animation:dl 1.6s .3s ease-in-out forwards}.gate .r{right:0;transform-origin:right;border-radius:0 90px 0 0;animation:dr 1.6s .3s ease-in-out forwards}
@keyframes dl{to{transform:rotateY(-110deg)}}@keyframes dr{to{transform:rotateY(110deg)}}
.troph{position:absolute;left:50%;top:50%;font-size:80px;transform:translate(-50%,-50%) scale(.2);animation:tr 1.4s 1.2s cubic-bezier(.3,1.6,.5,1) forwards;filter:drop-shadow(0 0 16px #ffd166)}@keyframes tr{to{transform:translate(-50%,-50%) scale(1)}}
</style>
</head>
<body>
<div id="scene"><svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMax slice"><defs><radialGradient id="sg"><stop offset="0" stop-color="#fff7b0"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient><linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9be8a4"/><stop offset="1" stop-color="#5cbf73"/></linearGradient><linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58c874"/><stop offset="1" stop-color="#2f9a52"/></linearGradient><linearGradient id="h3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fae62"/><stop offset="1" stop-color="#1f7f45"/></linearGradient></defs><circle cx="138" cy="16" r="22" fill="url(#sg)"/><circle cx="138" cy="16" r="8" fill="#ffe27a"/><g fill="none" stroke-width="2.2" opacity=".5"><path d="M6 72A62 62 0 0 1 130 72" stroke="#ff6b6b"/><path d="M8.2 72A59.8 59.8 0 0 1 127.8 72" stroke="#ffb347"/><path d="M10.4 72A57.6 57.6 0 0 1 125.6 72" stroke="#ffe066"/><path d="M12.6 72A55.4 55.4 0 0 1 123.4 72" stroke="#7be08a"/><path d="M14.8 72A53.2 53.2 0 0 1 121.2 72" stroke="#5ec8ff"/><path d="M17 72A51 51 0 0 1 119 72" stroke="#b48cff"/></g><g class="cl" fill="#fff" opacity=".92"><ellipse cx="30" cy="14" rx="12" ry="4"/><ellipse cx="38" cy="11" rx="7" ry="4"/><ellipse cx="100" cy="26" rx="14" ry="4.5"/><ellipse cx="108" cy="22" rx="7" ry="4"/></g><path d="M0 66Q30 50 60 64T120 60T160 64V90H0Z" fill="url(#h1)"/><path d="M0 76Q40 62 80 74T160 70V90H0Z" fill="url(#h2)"/><path d="M0 84Q50 74 100 84T160 82V90H0Z" fill="url(#h3)"/></svg></div>
<div id="app">
 <div id="top">
  <button id="bMap" title="Bản đồ">🗺️</button>
  <h1>Đảo Toán Học · <span id="stc">⭐ 0/20</span></h1>
  <button id="bHear" title="Nghe lại hướng dẫn">🗣️</button>
  <button id="bSnd" title="Bật hoặc tắt âm thanh">🔊</button>
  <input id="vol" type="range" min="0" max="1" step=".1" value=".9" aria-label="Âm lượng" style="width:clamp(60px,9vw,110px)"><button id="bFs" title="Toàn màn hình">⛶</button>
 </div>
 <div id="side">
  <div id="bub"></div>
  <svg id="bimo" viewBox="0 0 120 150" aria-label="Robot BIMO">
   <line x1="60" y1="22" x2="60" y2="8" stroke="#1d3557" stroke-width="4"/><circle cx="60" cy="8" r="7" fill="#ffd166"/>
   <rect x="18" y="22" width="84" height="64" rx="24" fill="#2f80ed"/>
   <rect x="27" y="31" width="66" height="44" rx="18" fill="#fff"/>
   <circle cx="46" cy="52" r="10" fill="#1d3557"/><circle cx="74" cy="52" r="10" fill="#1d3557"/>
   <circle cx="49" cy="48" r="3.5" fill="#fff"/><circle cx="77" cy="48" r="3.5" fill="#fff"/>
   <path id="bm" d="M50 66q10 8 20 0" stroke="#1d3557" stroke-width="3.5" fill="none" stroke-linecap="round"/>
   <circle cx="34" cy="64" r="4" fill="#ffb3c7"/><circle cx="86" cy="64" r="4" fill="#ffb3c7"/>
   <rect x="32" y="90" width="56" height="42" rx="16" fill="#fff" stroke="#2f80ed" stroke-width="4"/>
   <circle cx="60" cy="111" r="9" fill="#ffd166"/>
   <rect x="14" y="96" width="14" height="28" rx="7" fill="#2f80ed"/>
   <g class="arm"><rect x="92" y="96" width="14" height="28" rx="7" fill="#2f80ed"/></g>
   <ellipse cx="46" cy="140" rx="13" ry="7" fill="#2f80ed"/><ellipse cx="74" cy="140" rx="13" ry="7" fill="#2f80ed"/>
  </svg>
 </div>
 <main>
  <section id="start" class="scr">
   <div class="big2">🏝️🌈</div>
   <h2 style="font-size:clamp(24px,4.6vw,52px);margin:0">Cuộc phiêu lưu đến Đảo Toán Học</h2>
   <p style="font-size:clamp(16px,2.6vw,28px);margin:0;font-weight:700">Bé chinh phục các con số 0–10</p>
   <button class="big" id="bStart">▶ Bắt đầu</button><p style="font-size:14px;margin:0">🔒 Không thu thập thông tin. Tiến trình chỉ lưu trên thiết bị này.</p>
  </section>
  <section id="map" class="scr">
   <div class="map" id="mapBox"></div>
   <div class="nav"><button id="bRes">🏆 Xem kết quả</button><button id="bReset">↺ Bắt đầu lại từ đầu</button></div>
  </section>
  <section id="q" class="scr">
   <div class="card">
    <div class="zt" id="zt"></div><h2 id="qt"></h2>
